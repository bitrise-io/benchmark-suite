      BENCH_PASS: "1"
      BENCHMARK_PROJECT: "DuckDuckGo-iOS"
      BENCH_REPO_URL: "https://github.com/duckduckgo/apple-browsers.git"
      BENCH_REF_NAME: "7.244.0+ios"
      BENCH_COMMIT: "560c4f78a44aa1af839e4fef654392ccd8c912fc"
