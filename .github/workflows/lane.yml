      SCHEME: "iOS Browser"
      SIM_DEVICE_NAME: "iPhone 18 Pro"
      SIM_DESTINATION: "platform=iOS Simulator,name=iPhone 18 Pro,OS=latest"
      INCREMENTAL_TOUCH_FILE: "DuckDuckGo/Main/MainViewController.swift"
    steps:
