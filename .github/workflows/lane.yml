# One lane = every benchmark, one build at a time, on one Build Hub pool (standard-v3 rule: our builds never share a Mac).
# Each job checks out a bitrise-io/benchmark-* repo and runs that repo's .github/bench scripts.
# Jobs run in order; a failed job doesn't stop the lane. passes=2 runs the whole suite twice (2 builds per cell).
name: Lane
run-name: Lane ${{ inputs.runner }} (${{ inputs.passes }} pass(es), ${{ inputs.warmup_runs }}+${{ inputs.runs }} runs)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Build Hub pool"
        type: choice
        default: bitrise-m6-benchmark
        options: [bitrise-m6-benchmark, bitrise-m5pro-benchmark]
      passes:
        description: "Full passes of the suite (2 = 2 builds per cell)"
        type: choice
        default: "2"
        options: ["1", "2"]
      runs:
        description: "Measured runs per build"
        type: string
        default: "3"
      warmup_runs:
        description: "Warm-up runs per build"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: lane-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  p1-firefox:
    name: "pass 1 · firefox"
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      METHOD_VERSION: gha-lane-v1
      MACHINE_KEY: ${{ inputs.runner }}
      BENCHMARK_RUNS: ${{ inputs.runs }}
      WARMUP_RUNS: ${{ inputs.warmup_runs }}
      BENCH_PASS: "1"
      BENCHMARK_PROJECT: "Firefox-iOS"
      FIREFOX_PROJECT: "firefox-ios/Client.xcodeproj"
      FIREFOX_SCHEME: "Fennec"
      FIREFOX_CONFIGURATION: "Debug"
      BUILD_DESTINATION: "generic/platform=iOS Simulator"
      INCREMENTAL_FILE: "firefox-ios/Client/Application/AppDelegate.swift"
    steps:
      - name: Check out benchmark-firefox-ios
        uses: actions/checkout@v4
        with:
          repository: bitrise-io/benchmark-firefox-ios
          fetch-depth: 1
      - name: Stage scripts and paths
        run: |
          cp -R .github/bench "$RUNNER_TEMP/bench"
          echo "BENCH_OUT=$RUNNER_TEMP/bench-out" >> "$GITHUB_ENV"
          echo "SPM_DIR=$RUNNER_TEMP/firefox-spm" >> "$GITHUB_ENV"
      - name: Machine info
        run: source "$RUNNER_TEMP/bench/lib.sh" && sysinfo
      - name: Prepare (not timed)
        run: bash "$RUNNER_TEMP/bench/prepare.sh"
      - name: Benchmark
        run: bash "$RUNNER_TEMP/bench/run.sh"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-firefox-${{ inputs.runner }}
          path: ${{ runner.temp }}/bench-out
          if-no-files-found: warn
  p1-signal:
    name: "pass 1 · signal"
    needs: p1-firefox
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      METHOD_VERSION: gha-lane-v1
      MACHINE_KEY: ${{ inputs.runner }}
      BENCHMARK_RUNS: ${{ inputs.runs }}
      WARMUP_RUNS: ${{ inputs.warmup_runs }}
      BENCH_PASS: "1"
      BENCHMARK_PROJECT: "Signal-iOS"
      SIGNAL_SCHEME: "Signal"
      SIGNAL_CONFIGURATION: "Debug"
      INCREMENTAL_FILE: "Signal/AppLaunch/AppDelegate.swift"
    steps:
